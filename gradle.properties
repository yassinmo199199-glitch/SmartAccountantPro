org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin compile daemon memory (fixes "Could not connect to Kotlin compile daemon")
kotlin.daemon.jvmargs=-Xmx2g

# Disable KSP incremental processing — its byRounds backup dir causes duplicate-class javac errors
ksp.incremental=false
android.overridePathCheck=true
